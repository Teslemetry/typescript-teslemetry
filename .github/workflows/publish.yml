name: Publish

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/reusable-ci.yml

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          always-auth: true
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Build
        run: pnpm -r run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run ci:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Check for specific package releases
        id: check_releases
        if: steps.changesets.outputs.published == 'true'
        run: |
          node -e '
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
            const nodeRed = published.find(p => p.name === "@teslemetry/node-red-contrib-teslemetry");
            const n8n = published.find(p => p.name === "@teslemetry/n8n-nodes-teslemetry");

            if (nodeRed) {
              console.log("Found Node-RED release: " + nodeRed.version);
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "node_red_version=" + nodeRed.version + "\n");
            }
            if (n8n) {
              console.log("Found n8n release: " + n8n.version);
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "n8n_version=" + n8n.version + "\n");
            }
          '
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}

      - name: Discord Notification (Node-RED)
        if: steps.check_releases.outputs.node_red_version
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_NODERED }}
          VERSION: ${{ steps.check_releases.outputs.node_red_version }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"username\": \"Teslemetry Release\", \"content\": \"🚀 **New Release**\n**@teslemetry/node-red-contrib-teslemetry** version **$VERSION** is now available!\"}" \
          $DISCORD_WEBHOOK

      - name: Discord Notification (n8n)
        if: steps.check_releases.outputs.n8n_version
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_N8N }}
          VERSION: ${{ steps.check_releases.outputs.n8n_version }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"username\": \"Teslemetry Release\", \"content\": \"🚀 **New Release**\n**@teslemetry/n8n-nodes-teslemetry** version **$VERSION** is now available!\"}" \
          $DISCORD_WEBHOOK

      # Last, so a failed refresh cannot skip the notifications above.
      - name: Refresh Node-RED Flow Library
        if: steps.check_releases.outputs.node_red_version
        env:
          MODULE: "@teslemetry/node-red-contrib-teslemetry"
          VERSION: ${{ steps.check_releases.outputs.node_red_version }}
        run: |
          # flows.nodered.org does not watch npm: an entry only changes when its
          # "add node" form is submitted, which makes the server re-read the npm
          # registry. So wait until the registry serves the new version first.
          for _ in $(seq 30); do
            latest=$(curl --fail --silent "https://registry.npmjs.org/$MODULE" | jq -r '."dist-tags".latest') || latest=
            [ "$latest" = "$VERSION" ] && break
            sleep 10
          done
          [ "$latest" = "$VERSION" ] || { echo "::error::npm registry serves '$latest', not $VERSION"; exit 1; }

          jar=$(mktemp)
          body=$(mktemp)
          csrf=$(curl --fail --silent --show-error --cookie-jar "$jar" https://flows.nodered.org/add/node \
            | sed -n 's/.*name="_csrf"[^>]*value="\([^"]*\)".*/\1/p')
          [ -n "$csrf" ] || { echo "::error::flows.nodered.org served no CSRF token"; exit 1; }
          status=$(curl --silent --show-error --cookie "$jar" --output "$body" --write-out '%{http_code}' \
            --data-urlencode "_csrf=$csrf" --data-urlencode "module=$MODULE" https://flows.nodered.org/add/node)
          cat "$body"; echo
          # 200 answers with the module's URL; 400 "already at latest version"
          # means the library picked this release up before we asked.
          if [ "$status" = 200 ] && grep -q "^/node/$MODULE" "$body"; then exit 0; fi
          if [ "$status" = 400 ] && grep -qi "already at latest version" "$body"; then exit 0; fi
          echo "::error::Flow Library refresh failed (HTTP $status)"; exit 1
