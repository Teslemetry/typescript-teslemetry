<script type="text/javascript">
    RED.nodes.registerType("teslemetry-vehicle-command", {
        category: "Teslemetry Vehicle",
        paletteLabel: "Command",
        color: "#cc0000",
        defaults: {
            name: { value: "" },
            teslemetryConfig: {
                value: "",
                type: "teslemetry-config",
                required: true,
            },
            vin: { value: "" },
            command: { value: "vehicleData" },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-car",
        label: function () {
            return this.name || "Command: " + (this.command || "Data");
        },
        oneditprepare: function () {
            const node = this;
            const vinSelect = $("#node-input-vin");
            const configInput = $("#node-input-teslemetryConfig");

            function updateVins() {
                const configId = configInput.val();
                if (configId && configId !== "_ADD_") {
                    $.getJSON("teslemetry/vehicles", { config: configId })
                        .done(function (data) {
                            const current = vinSelect.val() || node.vin;
                            vinSelect.empty();
                            vinSelect.append(
                                '<option value="">From msg.vin</option>',
                            );
                            if (data && data.length > 0) {
                                data.forEach(function ([id, name]) {
                                    vinSelect.append(
                                        '<option value="' +
                                            id +
                                            '">' +
                                            name +
                                            " (" +
                                            id +
                                            ")</option>",
                                    );
                                });
                            }
                            if (current) {
                                vinSelect.val(current);
                            }
                        })
                        .fail(function (jqxhr, textStatus, error) {
                            console.error("Failed to fetch vehicles", error);
                        });
                }
            }

            configInput.change(function () {
                updateVins();
            });

            // Initial load if config is already selected
            if (configInput.val()) {
                updateVins();
            }
        },
    });
</script>

<script type="text/html" data-help-name="teslemetry-vehicle-command">
    <p>Interacts with a vehicle via Teslemetry API.</p>
    <p>Requires a valid Teslemetry configuration and a VIN.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">vin <span class="property-type">string</span></dt>
        <dd>VIN (if not set in config)</dd>
        <dt class="optional">
            command <span class="property-type">string</span>
        </dt>
        <dd>Command to execute (overrides config)</dd>
        <dt class="optional">
            payload <span class="property-type">object</span>
        </dt>
        <dd>
            Arguments for commands (e.g. <code>{ "percent": 80 }</code> for Set
            Charge Limit)
        </dd>
        <dt class="optional">
            time / departureTime / endOffPeakTime
            <span class="property-type">string</span>
        </dt>
        <dd>
            24-hour <code>HH:mm</code> time for the scheduled charging/
            departure commands.
        </dd>
    </dl>
    <p>
        <code>adjustVolume</code> sets an absolute volume. For volume
        up/down, read the <code>MediaAudioVolume</code> and
        <code>MediaAudioVolumeIncrement</code> fields with a Signal node,
        add/subtract them in a function node, and feed the result into
        <code>msg.volume</code>.
    </p>

    <h3>Valet Mode, PIN to Drive &amp; Speed Limit Mode</h3>
    <p>
        These commands restrict what the vehicle will do until reversed with
        the matching password/PIN, or an admin-clear/reset command run from
        an already-authenticated Teslemetry account (no password/PIN
        required):
    </p>
    <ul>
        <li>
            <b>Valet Mode</b> (<code>setValetModeOn</code>/<code
                >setValetModeOff</code
            >) hides trunk/frunk access, garage door codes, and navigation
            history from the driver, and caps top speed and acceleration.
            <code>resetValetPin</code> clears a forgotten valet password
            without needing the old one.
        </li>
        <li>
            <b>PIN to Drive</b> (<code>setPinToDriveOn</code>/<code
                >setPinToDriveOff</code
            >) requires the PIN be entered on the vehicle's touchscreen
            before it can be driven. <code>clearPinToDriveAdmin</code> and
            <code>resetPinToDrive</code> are admin-level overrides for a lost
            PIN.
        </li>
        <li>
            <b>Speed Limit Mode</b> (<code>speedLimitActivate</code>/<code
                >speedLimitDeactivate</code
            >) caps the vehicle's top speed at <code>msg.limitMph</code> (set
            separately via <code>speedLimitSetLimit</code>, 50-90 mph); the
            same PIN used to activate it is required to deactivate it or
            change the limit while active. <code>speedLimitClearPinAdmin</code>
            is the admin-level override for a lost PIN.
        </li>
    </ul>
    <p>
        <code>msg.password</code>/<code>msg.pin</code> are validated but
        never echoed back: on a validation failure (missing or wrong type),
        the node's error/status text redacts the value instead of including
        it, so a bad PIN or password never ends up in the debug sidebar or
        Node-RED log.
    </p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The response from the API.</dd>
    </dl>
</script>
