<script type="text/javascript">
    RED.nodes.registerType("teslemetry-energy-command", {
        category: "Teslemetry Energy",
        paletteLabel: "Command",
        color: "#e6e600",
        defaults: {
            name: { value: "" },
            teslemetryConfig: {
                value: "",
                type: "teslemetry-config",
                required: true,
            },
            siteId: { value: "" },
            localGateway: {
                value: "",
                type: "teslemetry-local-powerwall",
                required: false,
            },
            command: { value: "live_status" },
            args: { value: {} },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-bolt",
        label: function () {
            return this.name || "Energy: " + (this.command || "msg.command");
        },
        oneditprepare: function () {
            const node = this;
            const siteSelect = $("#node-input-siteId");
            const configInput = $("#node-input-teslemetryConfig");
            const paired = {};
            let catalog = {};

            const gatewayInput = $("#node-input-localGateway");

            // Commands that need `paired` need a key the gateway trusts:
            // Teslemetry's (the site is paired), or Node-RED's own through a
            // local gateway for the site, which only covers the commands the
            // gateway takes. They are greyed out otherwise. With "From msg.siteId" the site is unknown here; the
            // node refuses at runtime instead. The selected option is never
            // disabled: jQuery's val() returns null for a disabled one,
            // which would clear the saved command on Done.
            function updateCommands() {
                const siteId = siteSelect.val();
                const gateway = RED.nodes.node(gatewayInput.val());
                const local = !!gateway && gateway.siteId === siteId;
                const unpaired = !!siteId && paired[siteId] !== true;
                $("#node-input-command option").each(function () {
                    const spec = catalog[this.value];
                    // The earlier paired-only names all have a local form.
                    const legacy = $(this).hasClass("teslemetry-paired-only");
                    const needsKey = legacy || (spec && spec.paired);
                    const viaGateway = local && (legacy || (spec && spec.local));
                    this.disabled =
                        unpaired && needsKey && !viaGateway && !this.selected;
                });
            }

            const loadCommands = TeslemetryCommandEditor.setup(
                node,
                function (loaded) {
                    catalog = loaded;
                    updateCommands();
                },
            );

            function updateSites() {
                const configId = configInput.val();
                if (configId && configId !== "_ADD_") {
                    $.getJSON("teslemetry/energy_sites", { config: configId })
                        .done(function (data) {
                            const current = siteSelect.val() || node.siteId;
                            siteSelect.empty();
                            siteSelect.append(
                                '<option value="">From msg.siteId</option>',
                            );
                            if (data && data.length > 0) {
                                data.forEach(function ([id, name, isPaired]) {
                                    paired[id] = isPaired;
                                    siteSelect.append(
                                        '<option value="' +
                                            id +
                                            '">' +
                                            name +
                                            " (" +
                                            id +
                                            ")</option>",
                                    );
                                });
                            }
                            if (current) {
                                siteSelect.val(current);
                            }
                            updateCommands();
                        })
                        .fail(function (jqxhr, textStatus, error) {
                            console.error(
                                "Failed to fetch energy sites",
                                error,
                            );
                        });
                }
            }

            configInput.change(function () {
                updateSites();
            });
            siteSelect.change(updateCommands);
            gatewayInput.change(updateCommands);

            if (configInput.val()) {
                updateSites();
            }
            loadCommands({ product: "energy" });
        },
        oneditsave: function () {
            TeslemetryCommandEditor.save(this);
        },
    });
</script>

<script type="text/html" data-template-name="teslemetry-energy-command">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>

    </div>
    <div class="form-row">
        <label for="node-input-teslemetryConfig">

    </div>
    <div class="form-row">
        <label for="node-input-siteId">
            <i class="fa fa-home"></i> Site ID
        </label>
        <select id="node-input-siteId" style="width: 70%;">
            <option value="">From msg.siteId</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-localGateway">

    </div>
    <div class="form-row">
        <label for="node-input-command">
            <i class="fa fa-cogs"></i> Command
        </label>
        <select id="node-input-command">
            <option value="">From msg.command</option>
            <option value="getTariff">Get Tariff (TOU rates)</option>
            <optgroup id="node-input-command-earlier" label="Earlier names (still supported)">
            <option value="getLiveStatus">Get Live Status</option>
            <option value="getSiteInfo">Get Site Info</option>
            <option value="setOperationModeSelfConsumption">
                Mode: Self Consumption
            </option>
            <option value="setOperationModeBackup">Mode: Backup</option>
            <option value="setOperationModeAutonomous">Mode: Autonomous</option>
            <option value="setStormModeOn">Enable Storm Mode</option>
            <option value="setStormModeOff">Disable Storm Mode</option>
            <option value="setBackupReserve">
                Set Backup Reserve (msg.percentage)
            </option>
            <option value="setOffGridVehicleChargingReserve">
                Set Off-Grid Charge Reserve (msg.percent)
            </option>
            <option value="setTimeOfUseSettings">
                Set Time-of-Use Tariff (msg.tariffContentV2) - REPLACES
                entire schedule
            </option>
            <option value="gridExportEverything">Export Everything</option>
            <option value="gridExportSolar">Export Solar</option>
            <option value="gridExportNothing">Export Nothing</option>
            <option
                class="teslemetry-paired-only"
                value="dispatchBatteryPower"
            >
                Dispatch Battery Power (msg.powerWatts, msg.durationSeconds)
            </option>
            <option
                class="teslemetry-paired-only"
                value="resumeBatteryOperation"
            >
                Resume Battery Operation
            </option>
            <option class="teslemetry-paired-only" value="goOffGrid">
                Go Off-Grid (runs the home from the battery)
            </option>
            <option class="teslemetry-paired-only" value="reconnectGrid">
                Reconnect to Grid
            </option>
            </optgroup>
        </select>
        <div id="node-input-command-badge"></div>
    </div>
    <div id="node-input-args-container"></div>
</script>

<script type="text/html" data-help-name="teslemetry-energy-command">
    <p>Interacts with an Energy Site via Teslemetry API.</p>
    <p>Requires a valid Teslemetry configuration and a Site ID.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">
            siteId <span class="property-type">number</span>
        </dt>
        <dd>Energy Site ID (if not set in config)</dd>
        <dt class="optional">
            command <span class="property-type">string</span>
        </dt>
        <dd>
            Command to execute, e.g. <code>setStormModeOn</code>. Only used
            when Command is set to <b>From msg.command</b>; a command selected
            in the node takes precedence. Also takes any Teslemetry API energy
            site command by its route name, e.g. <code>backup</code> or
            <code>storm_mode</code>.
        </dd>
        <dt class="optional">
            payload <span class="property-type">object</span>
        </dt>
        <dd>
            Arguments for an API route name command, using the API's field
            names, e.g. <code>{ "backup_reserve_percent": 40 }</code> for
            <code>backup</code>.
        </dd>
        <dt class="optional">
            percentage / percent <span class="property-type">number</span>
        </dt>
        <dd>
            Command arguments are read from the top level of the message, not
            from <code>msg.payload</code>: <code>msg.percentage</code> (0-100)
            for <code>setBackupReserve</code> and <code>msg.percent</code>
            (0-100) for <code>setOffGridVehicleChargingReserve</code>.
        </dd>
        <dt class="optional">
            tariffContentV2 <span class="property-type">object</span>
        </dt>
        <dd>
            Full time-of-use tariff document for
            <code>setTimeOfUseSettings</code>, matching Tesla's
            <a
                href="https://digitalassets-energy.tesla.com/raw/upload/app/fleet-api/example-tariff/PGE-EV2-A.json"
                target="_blank"
            >example tariff JSON</a> shape: <code>version</code>,
            <code>utility</code>, <code>code</code>, <code>name</code>,
            <code>currency</code>, <code>daily_charges</code>,
            <code>demand_charges</code>, <code>energy_charges</code> and
            <code>seasons</code> are required.
            <strong>This document REPLACES the site's entire time-of-use
            schedule</strong> - it is not merged with the existing
            schedule, so a partial document will drop any rules it
            omits.
        </dd>
        <dt class="optional">
            powerWatts / durationSeconds
            <span class="property-type">number</span>
        </dt>
        <dd>
            For <code>dispatchBatteryPower</code>: <code>msg.powerWatts</code>
            is the battery power in watts, from -100000 to 100000, where a
            positive value discharges the battery and a negative value charges
            it. <code>msg.durationSeconds</code> is how long to hold that
            power, a whole number of seconds from 1 to 86400. When the
            duration ends the battery returns to normal operation by itself,
            and a new dispatch replaces the previous one. A dispatch can
            discharge below the backup reserve and export to the grid
            regardless of the site's export setting.
            <code>resumeBatteryOperation</code> ends a dispatch early.
        </dd>
    </dl>

    <h3>Local gateway</h3>
    <p>
        Optional. Pick a <b>Teslemetry Local Powerwall</b> config node to send
        commands to the Powerwall gateway over your local network. The
        messages in and out stay the same. These commands go to the gateway
        first: backup reserve, the three operation modes, the three grid
        export rules, dispatch, resume, go off-grid and reconnect to grid.
        If the gateway does not answer,
        the command is sent through the Teslemetry cloud instead and the
        node logs a warning. If the gateway answers and refuses, the node
        reports that error and does not try the cloud. A command that went
        to the cloud after the gateway timed out may have run twice.
    </p>
    <p>
        Every other command goes through the cloud as before. The gateway is
        only used for its own energy site. With a local gateway set, the
        status under the node shows <code>local</code> or <code>cloud</code>
        for the path the last command took.
    </p>

    <h3>Going off-grid</h3>
    <p>
        <code>goOffGrid</code> disconnects the home from the grid.
        <strong>The whole home then runs from the battery, and solar if there
        is any, until you send <code>reconnectGrid</code>.</strong> The
        gateway can refuse to go off-grid, for example when
        the battery is low; the node reports that as an error. A successful
        reply means the gateway accepted the request, not that the grid
        connection has changed: check <code>island_status</code> from
        <code>getLiveStatus</code> afterwards. The two commands take no
        arguments and follow the same signing rules as battery dispatch
        below.
    </p>

    <h3>Battery dispatch</h3>
    <p>
        Dispatch and resume must be signed with a key the gateway trusts.
        With a local gateway they are signed with Node-RED's own key and
        work without the internet. Without one they go through the
        Teslemetry cloud, which needs the site paired: Teslemetry's key
        verified on the gateway from the Teslemetry console. The two
        commands are greyed out for a site that has neither, and the node
        refuses them at runtime with an error. For a site that is not
        paired, dispatch and resume are never sent to the cloud, so they
        fail if the local gateway does not answer.
    </p>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The response from the API.</dd>
    </dl>
</script>
